name: Collect jobs

on:
  schedule:
    # Weekdays roughly 7am, 11am, 3pm, 7pm US Eastern (cron is UTC; minute 17 avoids the top-of-hour rush)
    - cron: '17 11,15,19,23 * * 1-5'
    # Weekends once a day
    - cron: '17 15 * * 0,6'
  workflow_dispatch:
    inputs:
      args:
        description: 'Collector flags, e.g. --tier=heavy, --ats=greenhouse, --only=gh:okta, --probe'
        required: false
        default: ''
      send_digest:
        description: 'Send email digest after collecting'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline tests
        run: node collector/test/run-tests.mjs

      - name: Collect
        env:
          ARGS: ${{ inputs.args }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node collector/collect.mjs $ARGS

      - name: Email digest
        if: ${{ github.event_name == 'schedule' || inputs.send_digest }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_REPLY_TO: ${{ secrets.ALERT_REPLY_TO }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
          DIGEST_SALT: ${{ secrets.DIGEST_SALT }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node collector/digest.mjs

      - name: Commit data
        run: |
          git config user.name "cache-flow-bot"
          git config user.email "cache-flow-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: collection run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
