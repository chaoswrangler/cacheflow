name: Collect jobs

on:
  schedule:
    # GitHub drops and delays cron runs, so wake hourly (6am-7pm ET in either DST state) and let
    # collector/gate.mjs collect only when a slot is due: weekdays 6am, 10am, 2pm, 6pm ET; weekends 10am ET.
    - cron: '17 10-23 * * *'
  workflow_dispatch:
    inputs:
      args:
        description: 'Collector flags, e.g. --tier=heavy, --ats=greenhouse, --only=gh:okta, --probe'
        required: false
        default: ''
      send_digest:
        description: 'Send email digest after collecting'
        type: boolean
        default: true
      digest_only:
        description: 'Skip collecting; just email matches from the current data (quick test)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (Node 24)

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (Node 24)
        with:
          node-version: '22'

      - name: Is a collection due?
        id: gate
        if: ${{ github.event_name == 'schedule' }}
        run: node collector/gate.mjs

      - name: Offline tests
        if: ${{ steps.gate.outputs.run != 'false' }}
        run: node collector/test/run-tests.mjs

      - name: Collect
        if: ${{ steps.gate.outputs.run != 'false' && !inputs.digest_only }}
        env:
          ARGS: ${{ inputs.args }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node collector/collect.mjs $ARGS

      - name: Email digest
        if: ${{ steps.gate.outputs.run != 'false' && (github.event_name == 'schedule' || inputs.send_digest) }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_REPLY_TO: ${{ secrets.ALERT_REPLY_TO }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
          DIGEST_SALT: ${{ secrets.DIGEST_SALT }}
          SITE_URL: ${{ secrets.SITE_URL }}
          DIGEST_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node collector/digest.mjs

      - name: Commit data
        if: ${{ steps.gate.outputs.run != 'false' }}
        run: |
          git config user.name "cache-flow-bot"
          git config user.email "cache-flow-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "data: collection run $(date -u +%Y-%m-%dT%H:%MZ)"
          # retry if a commit landed on main while collecting (e.g. an upload from github.dev)
          for i in 1 2 3 4; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i * 15))
          done
          echo "push failed after retries"; exit 1
